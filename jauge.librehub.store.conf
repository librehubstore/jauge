# Nginx (hôte) → conteneur Jauge (next start sur le port 3000).
# Certificat : certbot certonly --webroot -w /var/www/certbot -d jauge.librehub.store
# Côté app (.env) : BETTER_AUTH_URL=https://jauge.librehub.store

upstream jauge_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# HTTP : défi ACME, puis redirection vers HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name jauge.librehub.store;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jauge.librehub.store;

    ssl_certificate     /etc/letsencrypt/live/jauge.librehub.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jauge.librehub.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:jauge_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/jauge.librehub.store/chain.pem;

    # nosniff, X-Frame-Options et Referrer-Policy sont déjà posés par Next (next.config.ts).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 5m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/csv application/javascript application/json application/manifest+json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";
    proxy_read_timeout 60s;

    # Fichiers versionnés par Next : cache long côté navigateur, Next fixe déjà Cache-Control.
    location /_next/static/ {
        proxy_pass http://jauge_app;
        access_log off;
    }

    # Pages et API : rendu en streaming (React Server Components), donc pas de mise en tampon.
    location / {
        proxy_pass http://jauge_app;
        proxy_buffering off;
    }
}
